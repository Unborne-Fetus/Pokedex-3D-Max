name: Merge Switch models into Pokedex 3D Max

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/merge-switch-models.yml"

permissions:
  contents: write

concurrency:
  group: merge-switch-models
  cancel-in-progress: false

jobs:
  merge-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Pokedex 3D Max
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch original model repository
        run: |
          git clone --depth 1 --filter=blob:none https://github.com/Unborne-Fetus/Pokedex-3D-Models-Animations.git "$RUNNER_TEMP/switch-models"

      - name: Copy original GLBs into main repo
        run: |
          mkdir -p web/models/switch
          find "$RUNNER_TEMP/switch-models" -mindepth 2 -maxdepth 2 -type f -name regular.glb -print0 |
            while IFS= read -r -d '' source; do
              dex="$(basename "$(dirname "$source")")"
              mkdir -p "web/models/switch/$dex"
              cp "$source" "web/models/switch/$dex/regular.glb"
            done
          python3 scripts/build_merged_switch_manifest.py
          test "$(find web/models/switch -name regular.glb | wc -l)" -ge 700

      - name: Commit the complete merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/models/switch web/models/switch-manifest.js web/models/switch-manifest.json
          if git diff --cached --quiet; then
            echo "All models are already merged."
            exit 0
          fi
          git commit -m "Merge original Switch models into Pokedex 3D Max"
          git push origin HEAD:main
