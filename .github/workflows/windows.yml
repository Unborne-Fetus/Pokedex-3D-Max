name: Windows

on:
  push:
    branches: [main]
    paths:
      - "desktopApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktopApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Windows EXE and MSI
        shell: pwsh
        run: gradle :desktopApp:packageExe :desktopApp:packageMsi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex-3D-Max-Windows
          path: |
            desktopApp/build/compose/binaries/main/exe/**
            desktopApp/build/compose/binaries/main/msi/**
