name: Web

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shared app
        run: |
          node scripts/check_shared_app.js
          node scripts/test_static_switch_catalog.js
          node scripts/test_remote_switch_catalog.js
          python3 scripts/test_sync_switch_web.py

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R web _site/web
          # The Pages app works without Python or a launcher. Converted Switch
          # game models remain private unless separately provided for hosting.
          test -s _site/web/local-switch-catalog.js
          test -f _site/web/models/switch-manifest.js
          echo "Standalone browser viewer published; available model assets:"
          find _site/web/models -maxdepth 3 -type f 2>/dev/null | head -100 || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

