name: Switch Importer Smoke

on:
  push:
    branches: [main]
    paths:
      - "scripts/import_switch_game_assets.py"
      - "scripts/blender_import_switch_game_model.py"
      - "scripts/setup_all.ps1"
      - "setup-all.bat"
      - "import-switch-models.bat"
      - ".github/workflows/switch-importer-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/import_switch_game_assets.py"
      - "scripts/blender_import_switch_game_model.py"
      - "scripts/setup_all.ps1"
      - "setup-all.bat"
      - "import-switch-models.bat"
      - ".github/workflows/switch-importer-smoke.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile importer scripts
        run: |
          python -m py_compile             scripts/import_switch_game_assets.py             scripts/blender_import_switch_game_model.py

      - name: Run Switch importer self-tests
        run: python scripts/import_switch_game_assets.py --self-test

      - name: Parse PowerShell setup
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/setup_all.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Guard setup/importer pipeline version
        run: |
          python - <<'PY'
          from pathlib import Path
          importer = Path("scripts/import_switch_game_assets.py").read_text(encoding="utf-8")
          launcher = Path("setup-all.bat").read_text(encoding="utf-8")
          assert "CONVERSION_PIPELINE_VERSION = 4" in importer
          assert "pipeline-v4.ready.json" in launcher
          assert "-SwitchAssetsOnly" in launcher
          print("Setup and importer both target pipeline v4.")
          PY

      - name: Guard against incompatible animation fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("scripts/import_switch_game_assets.py").read_text(encoding="utf-8")
          forbidden = [
              'by_dex.get(job["dex"]',
              'exact or by_dex',
          ]
          found = [item for item in forbidden if item in text]
          if found:
              raise SystemExit(
                  "Unsafe cross-form animation fallback reintroduced: " + ", ".join(found)
              )
          print("No unsafe by-Dex animation fallback found.")
          PY
