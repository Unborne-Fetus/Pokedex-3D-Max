name: Switch Importer Smoke

on:
  push:
    branches: [main]
    paths:
      - "scripts/import_switch_game_assets.py"
      - "scripts/blender_import_switch_game_model.py"
      - "scripts/test_switch_materials.py"
      - "scripts/verify_switch_baseline.py"
      - "scripts/sync_switch_web.py"
      - "scripts/test_sync_switch_web.py"
      - "scripts/setup_all.ps1"
      - "setup-all.bat"
      - "import-switch-models.bat"
      - "scripts/recover_final_13.py"
      - "recover-final-13.bat"
      - "data/sv_model_dex.tsv"
      - "index.html"
      - "web/app.js"
      - "web/community-candidate-catalog.js"
      - "web/styles.css"
      - "scripts/test_community_candidate_catalog.js"
      - ".github/workflows/switch-importer-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/import_switch_game_assets.py"
      - "scripts/blender_import_switch_game_model.py"
      - "scripts/test_switch_materials.py"
      - "scripts/sync_switch_web.py"
      - "scripts/test_sync_switch_web.py"
      - "scripts/setup_all.ps1"
      - "setup-all.bat"
      - "import-switch-models.bat"
      - "scripts/recover_final_13.py"
      - "recover-final-13.bat"
      - "data/sv_model_dex.tsv"
      - "index.html"
      - "web/app.js"
      - "web/community-candidate-catalog.js"
      - "web/styles.css"
      - "scripts/test_community_candidate_catalog.js"
      - ".github/workflows/switch-importer-smoke.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile importer scripts
        run: |
          python -m py_compile             scripts/import_switch_game_assets.py             scripts/blender_import_switch_game_model.py             scripts/verify_switch_baseline.py

      - name: Run Switch importer self-tests and final-13 ID checks
        run: |
          python scripts/import_switch_game_assets.py --self-test
          python -m py_compile scripts/recover_final_13.py
          python scripts/recover_final_13.py --self-test

      - name: Test material selection and browser synchronization
        run: |
          python scripts/test_switch_materials.py
          python scripts/verify_switch_baseline.py --self-test
          python scripts/test_sync_switch_web.py

      - name: Verify community preview GLB metadata and safe Switch priority
        run: |
          node scripts/test_community_candidate_catalog.js
          node scripts/check_shared_app.js

      - name: Parse PowerShell setup
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/setup_all.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Guard setup/importer pipeline version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          importer = Path("scripts/import_switch_game_assets.py").read_text(encoding="utf-8")
          launcher = Path("setup-all.bat").read_text(encoding="utf-8")
          version = int(re.search(r"^CONVERSION_PIPELINE_VERSION = (\d+)$", importer, re.M).group(1))
          assert f"pipeline-v{version}.ready.json" in launcher
          assert "-SwitchAssetsOnly" in launcher
          print(f"Setup and importer both target pipeline v{version}.")
          PY

      - name: Guard against incompatible animation fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("scripts/import_switch_game_assets.py").read_text(encoding="utf-8")
          forbidden = [
              'by_dex.get(job["dex"]',
              'exact or by_dex',
          ]
          found = [item for item in forbidden if item in text]
          if found:
              raise SystemExit(
                  "Unsafe cross-form animation fallback reintroduced: " + ", ".join(found)
              )
          print("No unsafe by-Dex animation fallback found.")
          PY

